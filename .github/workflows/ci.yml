name: CI

on:
  push:
    branches:
      - master
      - testing
      - 'feature/**'
      - 'fix/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'
      - 'chore/**'
  pull_request:
    branches:
      - master
      - testing

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oroaroma_ci
          POSTGRES_USER: oroaroma_ci
          POSTGRES_PASSWORD: oroaroma_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oroaroma_ci -d oroaroma_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://oroaroma_ci:oroaroma_ci@localhost:5432/oroaroma_ci?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      RUN_DB_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:db

      - name: Build
        run: npx tsc -p tsconfig.json
