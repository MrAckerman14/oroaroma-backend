server {
    listen 80;
    listen [::]:80;
    server_name oroaroma-testing.protostages.com testing.protostages.com oroaroma.demo.protostages.com srv1628034.hstgr.cloud testing.177.7.45.94.nip.io testing.177.7.45.94.sslip.io oroaroma.testing oroaroma.177.7.45.94.sslip.io 177.7.45.94;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oroaroma-testing.protostages.com testing.protostages.com oroaroma.demo.protostages.com srv1628034.hstgr.cloud testing.177.7.45.94.nip.io testing.177.7.45.94.sslip.io oroaroma.testing oroaroma.177.7.45.94.sslip.io 177.7.45.94;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /opt/oroaroma-testing/frontend/current;
    index index.html;
    client_max_body_size 25m;

    location ~ ^/(auth|access|users|roles|tenants|stores|sales|reports|cash-closures|inventory|health|uploads)(/|$) {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /testing {
        return 302 /testing/;
    }

    location /testing/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
